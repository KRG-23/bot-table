name: ${COMPOSE_PROJECT_NAME:-otto-table-dev}

services:
  bot:
    build:
      context: .
      target: deps
    env_file:
      - .env.dev
    dns:
      - ${DNS_PRIMARY:-1.1.1.1}
      - ${DNS_SECONDARY:-8.8.8.8}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/usr/src/app
    command: sh -c "npm run prisma:generate && npm run dev"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - otto_postgres_data:/var/lib/postgresql/data
      - ./data/backups:/backups
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  otto_postgres_data:
